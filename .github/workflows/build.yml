name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download apktool 3.0.2 and uber-apk-signer 1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/tools/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
          curl -fsSL -o "$RUNNER_TEMP/tools/uber-apk-signer.jar" \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Build and sign
        run: |
          mkdir -p dist
          java -jar "$RUNNER_TEMP/tools/apktool.jar" b -f apktool -o dist/shuguang-unsigned.apk
          java -jar "$RUNNER_TEMP/tools/uber-apk-signer.jar" \
            --apks dist/shuguang-unsigned.apk --out dist --allowResign
          signed=$(find dist -name '*debugSigned.apk' | head -n 1)
          test -n "$signed"
          cp "$signed" dist/shuguang-debugSigned.apk
          sha256sum dist/shuguang-debugSigned.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shuguang-debug-apk
          path: |
            dist/shuguang-debugSigned.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
